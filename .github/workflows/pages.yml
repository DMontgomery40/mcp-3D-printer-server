name: Pages

# Builds the documentation site from README.md, docs/, CHANGELOG.md, and
# CONTRIBUTORS.md. Pull requests and other branches only build (the sync step
# fails on broken links, missing anchors, or README content without a page).
# Only main uploads and deploys, including manual runs.

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTORS.md
      - docs/**
      - src/index.ts
      - package.json
      - site/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTORS.md
      - docs/**
      - src/index.ts
      - package.json
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
